<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="reset.css">
    <!-- <link rel="stylesheet" href="main.css"> -->
    <link rel="stylesheet" href="minimal.css">
    <link rel="stylesheet" href="tapestry.css">
    <title>Nana Rudakova | Artist Designer</title>
</head>
<body>
    <div class = "main-divider">
        <div class = "center-view">
            <div class = "header-section">
                <div class  = "header-section image"></div>
                <h2 class   = "header-section line nana-ru"       >NANANANANAN</h2>
                <h2 class   = "header-section line dak"           >NANA</h2>
                <h2 class   = "header-section line ova"           >NANANANANAN</h2>
            </div>
            <ul>
                <div class = "picture-grid-line p5x2x2" style = "height : 30em">
                    <div class = "picture-grid-row p3x1">

                        <!-- PICTURE #0 : LINE 0 ROW 0 CELL 0   -->

                        <div class = "picture-grid-cell" style = "padding: 0.5em 0.2em 0.5em 1em">
                            <div class = "grid-picture">
                                <div class = "paspartu">
                                    <p class = "top-text">"Name of the picture"</p>
                                    <div class = "grid-picture"></div>
                                    <p class = "bottom-text">date, medium and possibly a tagline</p>
                                </div>
                            </div>
                        </div>

                        <!-- =================================  -->


                        <!-- PICTURE #1 : LINE 0 ROW 0 CELL 1   -->

                        <div class = "picture-grid-cell" style = "padding: 0.2em 0.5em 0.2em 0.5em">    
                            <div class = "grid-picture"></div>
                        </div>

                        <!-- =================================  -->

                    </div>
                    <div class = "picture-grid-row p1x2x1">
                        <div class = "picture-grid-cell" style = "padding: 0.7em 0.4em 0.35em 0.2em">   
                            <div class = "grid-picture"></div>
                        </div>
                        <div class = "picture-grid-cell" style = "padding: 0.3em 0.9em 0.5em 0.5em">    
                            <div class = "grid-picture"></div>
                        </div>
                        <div class = "picture-grid-cell" style = "padding: 0.2em 0.5em 0.5em 1em">      
                            <div class = "grid-picture"></div>
                        </div>
                    </div>
                    <div class = "picture-grid-row p1x1">
                        <div class = "picture-grid-cell" style = "padding: 1em 0.9em 0.5em 0.3em">      
                            <div class = "grid-picture"></div>
                        </div>
                        <div class = "picture-grid-cell" style = "padding: 0.2em 0.5em 0.2em 0.7em">    
                            <div class = "grid-picture"></div>
                        </div>
                    </div>
                </div>
                <div class = "picture-grid-line p2x2x3">
                    <div class = "picture-grid-cell" style = "padding: 0.7em 0.4em 0.35em 0.2em">   <div class = "grid-picture"></div></div>
                    <div class = "picture-grid-cell" style = "padding: 0.3em 0.9em 0.5em 0.5em">    <div class = "grid-picture"></div></div>
                    <div class = "picture-grid-cell" style = "padding: 0.2em 0.5em 0.5em 1em">      <div class = "grid-picture"></div></div>
                </div>
                <div class = "picture-grid-line p1x2x4">

                </div>
                <div class = "picture-grid-line"></div>
                <div class = "picture-grid-line"></div>
                <div class = "picture-grid-line"></div>
                <div class = "picture-grid-line"></div>

            </ul>
        </div>
    </div>
</body>
</html>
